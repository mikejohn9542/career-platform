# Site for aws.michaeljportfolio.me on the EC2 instance.
# Install only AFTER the certificate exists (see deploy/README.md), or `nginx -t` fails on the
# missing certificate files.

server {
    listen 80;
    listen [::]:80;
    server_name aws.michaeljportfolio.me;

    # Renewals re-use the HTTP-01 challenge, so this must keep working after cutover to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aws.michaeljportfolio.me;

    ssl_certificate     /etc/letsencrypt/live/aws.michaeljportfolio.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws.michaeljportfolio.me/privkey.pem;

    # The app listens on 127.0.0.1:3000 only (see --hostname in career-platform.service), and no
    # security-group rule exposes 3000, so Nginx is the only way in.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # src/middleware.ts reads this to decide whether to redirect. Without it every request
        # looks like plain HTTP to the app and it redirects forever.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
