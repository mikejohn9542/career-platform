# Temporary site, used ONLY to obtain the first certificate.
#
# nginx-aws.conf references certificate files under /etc/letsencrypt/live/. Those do not exist
# before certbot has run, so installing it first makes `nginx -t` fail. Install this file,
# obtain the certificate, then replace it with nginx-aws.conf.

server {
    listen 80;
    listen [::]:80;
    server_name aws.michaeljportfolio.me;

    # certbot --webroot writes its HTTP-01 challenge here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 404;
    }
}
